[project]
name = "wonder-evals"
version = "0.1.0"
description = "Datasets, evaluadores, experimentos y tareas online de Arize AX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize",
    "httpx",
    "pandas",
    "pyyaml",
    "langchain-google-vertexai",
    "anthropic[vertex]",
    "langchain-core",
]

[project.scripts]
wonder-evals = "wonder_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_evals"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "wonder_evals/tasks"
