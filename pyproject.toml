[project]
name = "agentic-lab"
version = "0.1.0"
description = "Lab replicable de IA agéntica: Arize AX + Bindplane + Dynatrace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["app/common", "app/agent", "app/mcp-server", "app/seed", "evals", "scenarios"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # el formateador ya parte el código; quedan prompts y cadenas largas

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/agent/tests", "app/mcp-server/tests", "evals/tests", "scenarios/tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:create_react_agent has been moved:DeprecationWarning"]
