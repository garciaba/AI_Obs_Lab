[project]
name = "wonder-evals"
version = "0.1.0"
description = "Datasets, evaluadores, experimentos y tareas online de Arize AX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize",
    "httpx",
    "pandas",
    "pyyaml",
    "langchain-aws",
    "langchain-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_evals"]
