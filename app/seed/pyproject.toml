[project]
name = "wonder-seed"
version = "0.1.0"
description = "Carga del catálogo en ChromaDB y del esquema y datos en Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb",
    "psycopg[binary]",
]

[project.scripts]
wonder-seed = "wonder_seed.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_seed"]
