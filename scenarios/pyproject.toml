[project]
name = "wonder-scenarios"
version = "0.1.0"
description = "Escenarios de fallo autorreversibles y generador de carga"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "pyyaml",
]

[project.scripts]
scenario = "wonder_scenarios.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_scenarios"]
